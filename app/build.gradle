plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Сборка из ветки test (APP_VARIANT=test) — отдельное приложение «PharmShop Test» без автообновления.
def isTest = System.getenv('APP_VARIANT') == 'test'

android {
    namespace 'ru.pharmshop.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.pharmshop.app'
        minSdk 24
        targetSdk 34
        // В GitHub Actions versionCode растёт сам (номер запуска + 100), локально — 2.
        def run = System.getenv('GITHUB_RUN_NUMBER')
        versionCode run ? run.toInteger() + 100 : 2
        versionName project.findProperty('appVersion') ?: '1.0.3-beta'   // название версии задаётся в gradle.properties
        // Репозиторий для проверки обновлений («владелец/имя»); GitHub подставляет его сам при сборке.
        buildConfigField 'String', 'GITHUB_REPO', "\"${isTest ? '' : (System.getenv('GITHUB_REPOSITORY') ?: '')}\""
        manifestPlaceholders = [appLabel: isTest ? 'PharmShop Test' : 'PharmShop']
        if (isTest) {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
        }
    }
    // Постоянный ключ подписи: без него новая версия не встанет поверх старой.
    signingConfigs {
        ci {
            def ksFile = System.getenv('KEYSTORE_FILE')
            if (ksFile) {   // свой ключ из секретов GitHub (необязательно)
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            } else {        // ключ, лежащий в репозитории: app/release.keystore
                storeFile file('release.keystore')
                storePassword 'pharmshop123'
                keyAlias 'pharmshop'
                keyPassword 'pharmshop123'
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.ci }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.github.hCaptcha.hcaptcha-android-sdk:sdk:5.0.0'
}
