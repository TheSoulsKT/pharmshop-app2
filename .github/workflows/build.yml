name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon --stacktrace
        env:
          SUPPORT_BOT_TOKEN: ${{ secrets.SUPPORT_BOT_TOKEN }}
          SUPPORT_CHAT_ID: ${{ secrets.SUPPORT_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: PharmShop-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (for in-app updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((GITHUB_RUN_NUMBER + 100))
          VERSION=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          cp app/build/outputs/apk/debug/app-debug.apk "PharmShop-${VERSION}.apk"
          NOTES=$(git log -1 --pretty=%B)
          gh release create "build-${CODE}" "PharmShop-${VERSION}.apk" \
            --title "Версия ${VERSION}" \
            --notes "$NOTES" \
            --latest
