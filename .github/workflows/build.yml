name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Ключ подписи берём из секретов. Без него не собираем: APK с другой подписью не встанет поверх установленного.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Не заданы секреты KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (см. server/README.md)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      # Ядро Xray (VPN внутри приложения). Версия закреплена: новая версия может поменять API и сломать VpnCore.kt.
      # Если положите libv2ray.aar в app/libs сами, этот шаг его не скачивает, но сумму всё равно сверяет.
      # XRAY_LIB_SHA256 — SHA-256 именно этого файла этой версии. Пока он пуст, сборка проходит и пишет сумму в лог
      # (строка «libv2ray.aar sha256: …»): проверьте, что это тот файл, которому доверяете, и впишите её сюда.
      # С заданной суммой несовпадение останавливает сборку. Меняя XRAY_LIB_TAG, меняйте и сумму.
      - name: Download Xray core
        env:
          XRAY_LIB_TAG: v26.8.20
          XRAY_LIB_SHA256: ""
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/libv2ray.aar ]; then
            curl -fL --retry 3 -o app/libs/libv2ray.aar \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/${XRAY_LIB_TAG}/libv2ray.aar"
          fi
          ls -l app/libs/libv2ray.aar
          actual=$(sha256sum app/libs/libv2ray.aar | cut -d' ' -f1)
          echo "libv2ray.aar sha256: $actual"
          if [ -n "$XRAY_LIB_SHA256" ]; then
            if [ "$actual" != "$XRAY_LIB_SHA256" ]; then
              echo "::error::libv2ray.aar: сумма $actual не совпала с XRAY_LIB_SHA256 ($XRAY_LIB_SHA256)"
              exit 1
            fi
          else
            echo "::warning::XRAY_LIB_SHA256 не задан: ядро Xray не проверяется. Впишите сумму из строки выше в build.yml"
          fi
      # geoip.dat / geosite.dat (маршрутизация «российское напрямую», правила подписки с geoip:/geosite:).
      # Приложение копирует их из assets/geo в filesDir и раз в неделю обновляет само (GeoFiles.kt).
      - name: Download geo files
        run: |
          mkdir -p app/src/main/assets/geo
          for f in geoip.dat geosite.dat; do
            curl -fL --retry 3 -o "app/src/main/assets/geo/$f" \
              "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/$f"
          done
          ls -l app/src/main/assets/geo
          # «Блокировать рекламу» отправляет geosite:category-ads-all в blackhole: тег должен быть в geosite.dat.
          # Без него приложение само отключит этот переключатель (GeoFiles.hasSite), но лучше узнать об этом на сборке.
          if grep -aqi 'category-ads-all' app/src/main/assets/geo/geosite.dat; then
            echo "geosite:category-ads-all найден"
          else
            echo "::warning::В geosite.dat нет category-ads-all — блокировка рекламы в приложении будет недоступна"
          fi
      - run: gradle assembleRelease --no-daemon --stacktrace
      - name: Check APK signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PharmShop-apk
          path: app/build/outputs/apk/release/app-release.apk
      # mapping.txt нужен, чтобы расшифровывать стектрейсы из релизной сборки
      - uses: actions/upload-artifact@v4
        with:
          name: R8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
      - name: Publish release (for in-app updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((GITHUB_RUN_NUMBER + 100))
          VERSION=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          cp app/build/outputs/apk/release/app-release.apk "PharmShop-${VERSION}.apk"
          # контрольная сумма: приложение сверяет её после скачивания и не ставит файл, если она не совпала
          HASH=$(sha256sum "PharmShop-${VERSION}.apk" | cut -d' ' -f1)
          echo "$HASH" > "PharmShop-${VERSION}.apk.sha256"
          NOTES="$(git log -1 --pretty=%B)

          SHA-256: ${HASH}"
          gh release create "build-${CODE}" "PharmShop-${VERSION}.apk" "PharmShop-${VERSION}.apk.sha256" \
            --title "Версия ${VERSION}" \
            --notes "$NOTES" \
            --latest
